# Render Blueprint — deploys the two application services.
#
# The Postgres database is NOT declared here: it already exists (created
# directly on Render before this Blueprint), so this file references it via
# env vars you'll be prompted to paste in when you connect this Blueprint —
# those values are never written into this file or committed to git.
#
# After connecting: Render will ask for every "sync: false" value below.
# Have ready: your Anthropic API key, and the database connection URL
# (from the existing Postgres instance's "Connect" page).
#
# n8n was removed from this architecture (see the n8n-removal migration) --
# what used to be a third service (a self-hosted n8n container orchestrating
# calls back into ap-agent-service over HTTP) is now two extra routes
# (/webhook/uc1-ask, /webhook/uc2-validate) directly on ap-agent-service
# itself, calling the same compute/tax-lookup/diff/guard logic as plain
# in-process Python function calls instead of network round-trips.

services:
  # ---------------------------------------------------------------------
  # Python/FastAPI — deterministic compute, tax lookup, diff, the
  # narration guard, AND (as of the n8n-removal migration) the UC1/UC2
  # orchestration itself: Parse Intent, vendor resolution, retrieval, and
  # narration, all in-process. Reads the pre-built tax-document search
  # index committed at service/chroma_db/ (read-only) rather than
  # rebuilding it on every deploy. Rebuilding at deploy time meant
  # installing and *loading* torch/sentence-transformers just to re-embed
  # documents that hadn't changed -- that's what caused an out-of-memory
  # crash on Render's free tier. Regenerate the index locally with
  # `pip install -r requirements-ingest.txt && python ingest.py` whenever
  # tax_docs/ changes, then re-commit service/chroma_db/.
  # ---------------------------------------------------------------------
  - type: web
    name: ap-agent-service
    runtime: python
    rootDir: service
    # starter, not free -- purely to remove Free tier's 15-min-inactivity
    # spin-down (confirmed via Render's own docs: that behavior is scoped
    # explicitly to "Free web service", not to paid instance types).
    # 512MB is already proven sufficient here (see the OOM-fix commit) --
    # this is not a resource upgrade, only an always-on one. Adding
    # psycopg2-binary + anthropic to requirements.txt for orchestration
    # does not change this: both are lightweight, and the OOM cause above
    # was specifically torch/sentence-transformers, never these two.
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false

  # ---------------------------------------------------------------------
  # Streamlit — the chat UI, UC2 validation, and the browse-data tab.
  # Talks to ap-agent-service's public URL for both the UC1/UC2 webhook
  # routes and (separately) reads Postgres directly for the browse-data
  # tab only — never for anything the agent computes.
  # ---------------------------------------------------------------------
  - type: web
    name: ap-agent-frontend
    runtime: python
    rootDir: frontend
    # starter, not free -- same reasoning as ap-agent-service above: only to
    # remove the Free-tier spin-down, not because it needs more resources.
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      # Predicted from the service name above (Render's default URL pattern
      # is https://<service-name>.onrender.com). If Render assigns a
      # different subdomain (e.g. due to a name collision), update this
      # value to match after the first deploy -- everything else is fine.
      - key: ORCHESTRATOR_BASE_URL
        value: https://ap-agent-service.onrender.com
      - key: DATABASE_URL
        sync: false
