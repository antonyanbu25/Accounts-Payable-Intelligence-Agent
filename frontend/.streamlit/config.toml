# Committed deliberately (see ../../.gitignore) -- pins the theme regardless
# of the viewer's OS light/dark setting, and moves off Streamlit's default
# red accent to a restrained slate-teal more in keeping with a finance tool
# than a generic demo.
[theme]
base = "light"
primaryColor = "#3d6b6f"
# Slightly off-white, not pure #ffffff -- gives card-like elements (metrics,
# alerts, the chat input) something to visibly sit above via box-shadow in
# the CSS block in app.py. Pure white-on-white has no room for elevation.
backgroundColor = "#f6f7f7"
secondaryBackgroundColor = "#eef1f1"
textColor = "#1a1f1f"
font = "sans serif"
