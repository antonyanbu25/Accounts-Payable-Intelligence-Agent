# Committed deliberately (see ../../.gitignore) -- pins the theme regardless
# of the viewer's OS light/dark setting. Dark-glow restyle (see
# design suggestions/validate-payment-advice-build-prompt.md): near-black
# base, muted blue accent reserved for active-state indicators, the glow,
# and small functional tags -- never a large fill.
[theme]
base = "dark"
primaryColor = "#5b8fd9"
backgroundColor = "#0a0a0d"
secondaryBackgroundColor = "#131316"
textColor = "#e8e8ea"
# Streamlit's font field only accepts a small named set ("sans serif" /
# "serif" / "monospace") on the pinned 1.62.0 -- Inter is loaded reliably
# via a CSS @import in the app.py stylesheet block instead, which also
# guarantees it survives a future Streamlit version bump regardless of
# whether font: support changes. This value is the fallback before that
# CSS loads.
font = "sans serif"

# Streamlit's own default chrome (a "Deploy" button, and a hamburger menu
# exposing Rerun/Settings/Print/Record a screencast/Developer options ->
# Clear cache) is visible on the live deployed app to any viewer, including
# a recruiter -- nothing built for this project, just framework noise with
# no place in a polished demo. "minimal" hides the Deploy button and trims
# the menu to the smallest necessary set.
[client]
toolbarMode = "minimal"
