# Committed deliberately (see ../../.gitignore) -- pins the theme regardless
# of the viewer's OS light/dark setting, and moves off Streamlit's default
# red accent to a restrained slate-teal more in keeping with a finance tool
# than a generic demo.
[theme]
base = "light"
primaryColor = "#3d6b6f"
# Slightly off-white, not pure #ffffff -- gives card-like elements (metrics,
# alerts, the chat input) something to visibly sit above via box-shadow in
# the CSS block in app.py. Pure white-on-white has no room for elevation.
# Hex equivalent of oklch(98% 0.003 260) -- config.toml only accepts hex/rgb,
# not CSS color functions, so this is that value converted, not guessed.
backgroundColor = "#f7f7f9"
secondaryBackgroundColor = "#eef0f1"
textColor = "#1a1f1f"
font = "sans serif"

# Streamlit's own default chrome (a "Deploy" button, and a hamburger menu
# exposing Rerun/Settings/Print/Record a screencast/Developer options ->
# Clear cache) is visible on the live deployed app to any viewer, including
# a recruiter -- nothing built for this project, just framework noise with
# no place in a polished demo. "minimal" hides the Deploy button and trims
# the menu to the smallest necessary set.
[client]
toolbarMode = "minimal"
